<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="pomodorotimerpage">
      <div class="timebox">
        <h1 id="tame">25:00</h1>
      <button id="start">Start</button>
      <button id="stop">Stop</button>
      <button id="reset">Reset</button>
      </div>
      <div id="close">X</div>

    </div>
    <div id="dashboard">
      <header id="header">
      <h1>Productivity Dashboard</h1>
      <h3 id="themeBtn"><i class="ri-moon-line"></i>Dark Mode</h3>
    </header>
    <main class="banner">

    <div class="datetime">
        <h1 id="time">10:45 AM</h1>
        <h2 id="day">Monday</h2>
        <p id="date">09 July 2026</p>
    </div>

    <div class="weather">
        <h2 id="city">Lucknow</h2>

        <div class="weather-box">
            <img id="icon" src="" alt="">
            <h1 id="temp">32°C</h1>
        </div>

        <p id="condition">Sunny</p>

        <div class="extra">
            <span id="humidity">Humidity: 65%</span>
            <span id="wind">Wind: 3 m/s</span>
        </div>
    </div>

</main>
    <footer>
      <div class="todolist box" ><h4>To Do List</h4></div>
      <div class="dailyplanner box"><h4>Daily Planner</h4></div>
      <div class="pomodorotimer box"><h4>Pomodoro Timer</h4></div>
      <div class="dailygoals box"><h4>Daily Goals</h4></div>
      <div class="motivation box"><h4>motivation</h4></div>
    </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
